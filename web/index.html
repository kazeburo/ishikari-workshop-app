<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>くるくる画像工房</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><span class="tag">データセンターのおしごと体験</span><h1>くるくる画像工房</h1><p>描いて、送って、変身！ サーバに画像をつくってもらおう。</p></div><div id="health" role="status">サーバを確認中…</div></header>
<main><section class="panel"><h2><span>1</span> もとになる画像をつくろう</h2><div class="tools"><label class="file button">写真をえらぶ<input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label><button id="camera">カメラをつかう</button></div><div class="tools">
<label for="preset">お手本・背景</label>
<select id="preset">
<optgroup label="そのまま変身させるお手本">
<option value="sample">カラフルな丸</option>
<option value="flowers">花畑</option>
<option value="fish">熱帯魚</option>
</optgroup>
<optgroup label="上から描ける背景">
<option value="snow">石狩の雪景色</option>
<option value="space">星空</option>
<option value="sea">海の中</option>
</optgroup>
</select>
<button id="sample">キャンバスに使う</button>
</div>
<p class="hint">「キャンバスに使う」と今の絵が入れ替わります。選んだ画像の上から絵を描けます。</p><div class="drawing"><canvas id="source" width="640" height="640" aria-label="絵を描くキャンバス"></canvas></div><div class="tools"><label>色 <input id="color" type="color" value="#ed4981"></label><label>太さ <input id="width" type="range" min="3" max="65" value="22"></label><button id="clear">白紙にする</button></div><div id="cameraBox" hidden><video id="video" autoplay playsinline muted></video><div class="tools"><button id="capture">この写真をつかう</button><button id="closeCamera">カメラを閉じる</button></div></div></section>
<section class="panel"><h2><span>2</span> サーバで変身させよう</h2><div class="modes"><label><input type="radio" name="mode" value="kaleidoscope" checked> 万華鏡</label><label><input type="radio" name="mode" value="mosaic"> モザイクタイル</label></div><label class="amount"><span id="amountLabel">もようの数</span><input id="amount" type="range" min="3" max="16" value="8"><output id="amountValue">8</output></label><button class="primary" id="convert">サーバに送って変身！</button><p id="message" role="status" aria-live="polite">画像を送ると、サーバが計算して結果を返してくれます。</p><div class="result"><img id="result" alt="サーバで変換した画像" hidden><div id="empty">どんな作品ができるかな？</div></div><a id="download" class="button" download="作品.png" hidden>作品を保存する</a><p class="hint">写真は変換のためにサーバへ送ります。サーバのファイルには保存しません。</p></section></main><footer>つくる（ノートPC） → 変身をお願いする → 計算する（サーバ） → 作品が届く</footer><script src="app.js"></script></body></html>
